services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: symfony_app_prod
    ports:
      - "80:80"
    environment:
      APP_ENV: prod
      DATABASE_URL: "mysql://symfony:symfony@database:3306/symfony?serverVersion=8.0"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: symfony_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data_prod:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: symfony_phpmyadmin_prod
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data_prod:
